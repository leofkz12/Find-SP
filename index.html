<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spider-Verse Comics Reader</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <button class="menu-btn" onclick="toggleMenu()">
    <span>🕸️ Menu</span>
    <span class="dots">⋮</span>
  </button>

  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <h2>🕸️ SPIDER MENU</h2>
      <button class="close-btn" onclick="toggleMenu()">&times;</button>
    </div>

    <nav class="sidebar-nav">
      <a href="#" class="nav-item active" onclick="filtrarHQs('todas')">
        <span class="icon">📚</span> Todas HQs
      </a>
      <a href="#" class="nav-item" onclick="filtrarHQs('hq')">
        <span class="icon">📖</span> HQs
      </a>
      <a href="#" class="nav-item" onclick="filtrarHQs('manga')">
        <span class="icon">🎌</span> Mangás
      </a>
      <a href="#" class="nav-item" onclick="filtrarHQs('favoritos')">
        <span class="icon">⭐</span> Favoritos
      </a>
    </nav>
  </aside>

  <div id="overlay" class="overlay" onclick="toggleMenu()"></div>

  <div class="teia-bg"></div>
  <div class="teia-canto canto-esquerdo"></div>
  <div class="teia-canto canto-direito"></div>

  <div class="container">
    <header class="header">
      <div class="spider-icon">🕸️</div>
      <h1>SPIDER READER</h1>
      <p class="subtitulo-hq">Explore as histórias do Aranhaverso</p>
    </header>

    <div class="busca-container">
      <input type="text" id="input-busca" placeholder="Buscar história..." onkeyup="if(event.key === 'Enter') pesquisarHQ()">
      <button onclick="pesquisarHQ()" class="btn-nav">🔍 Buscar</button>
    </div>

    <div id="seletores-topo" class="menu-selecao">
      <div class="campo">
        <label for="select-hq">História</label>
        <select id="select-hq" onchange="mudarHQ()"></select>
      </div>

      <div class="campo">
        <label for="select-capitulo">Capítulo</label>
        <select id="select-capitulo" onchange="mudarCapitulo()"></select>
      </div>
    </div>

    <button id="btn-voltar" class="btn-nav escondido" onclick="voltarInicio()">◀ Voltar</button>

    <div id="biblioteca-hqs" class="biblioteca-grid escondido"></div>

    <div id="card-capa" class="capa-box">
      <img id="imagem-capa" src="" alt="Capa da HQ">
      <div class="capa-overlay">
        <button onclick="iniciarLeitura()" class="btn-iniciar">🚀 LER AGORA</button>
      </div>
    </div>

    <div id="area-leitor" class="escondido">
      <div class="leitor-box">
        <img id="pagina-imagem" src="" alt="Página da HQ">
      </div>

      <div class="controles">
        <button onclick="paginaAnterior()" class="btn-nav">◀ Anterior</button>
        <span id="contador-pagina">Página 1</span>
        <button onclick="proximaPagina()" class="btn-nav">Próxima ▶</button>
      </div>
    </div>
  </div>

  <script src="dados.js"></script>
  <script src="script.js"></script>
</body>
</html>
