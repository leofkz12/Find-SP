<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Busca de Personagens de Anime</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="fundo-aranhas"></div>

  <div class="container">
    <h1>Pesquisar Personagem</h1>
    
  <div class="busca-box">
    <input type="text" id="nome-personagem" placeholder="Digite o nome (ex: Naruto, Killua)...">
    <button onclick="buscarPersonagem()">Buscar</button>
  </div>

    <p id="status-mensagem"></p>

    <div id="card-personagem" class="card escondido">
      <img id="img-personagem" src="" alt="Foto do Personagem">
      <h2 id="titulo-nome"></h2>
      <p id="nome-japones" class="subtitulo"></p>
      
      <div class="info-detalhes">
        <p><strong>História / Sobre:</strong></p>
        <p id="sobre-personagem" class="descricao"></p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
